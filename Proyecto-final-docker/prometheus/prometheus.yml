global:
  scrape_interval: 5s

scrape_configs:
  - job_name: 'backends'
    static_configs:
      - targets: ['backend1:3000', 'backend2:3000', 'backend3:3000']

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']